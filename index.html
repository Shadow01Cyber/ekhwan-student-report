<head>

<style>

<script>

'Name: @EkhwanAlEraqion\n' +
'Channel ID: -1001271142828\n' +
'URL: https://t.me/EkhwanAlEraqion\n' +

'1. My private photos were shared without my consent — photos I took for myself, not for 1,800 strangers\n' +
'2. My personal phone number was published — strangers call me at midnight asking things I will not write here\n' +

'4. Sexual and degrading captions were added to my photos — I did not agree to any of this\n' +

'https://t.me/EkhwanAlEraqion/147\n' +
'https://t.me/EkhwanAlEraqion/271\n' +
'https://t.me/EkhwanAlEraqion/251\n' +
'https://t.me/EkhwanAlEraqion/161\n\n' +

function go(){window.location.href='mailto:'+to+'?subject='+encodeURIComponent(su)+'&body='+encodeURIComponent(body)}
var s=5;var el=document.getElementById('cd');var bf=document.getElementById('bar');
var iv=setInterval(function(){s--;el.textContent=s;bf.style.width=((5-s)/5)*100+'%';if(s<=0){clearInterval(iv);go()}},1000);

</body>
</html>
